
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Panel de pedidos - Flame Burger"
    >

    <title>
        Pedidos - Flame Burger
    </title>

    <!-- ESTILOS -->
    <link
        rel="stylesheet"
        href="css/admin.css"
    >

    <link
        rel="stylesheet"
        href="css/pedidos.css"
    >

</head>


<body>


    <!-- HEADER -->

    <header class="admin-header">

        <div class="header-left">

            <a
                href="dashboard.html"
                class="logo"
            >
                🔥 Flame Burger
            </a>

        </div>


        <div class="header-right">

            <span
                id="pedidosNuevos"
                class="pedidos-nuevos"
            >
                0 pedidos nuevos
            </span>

        </div>

    </header>


    <!-- CONTENEDOR PRINCIPAL -->

    <main class="admin-container">


        <!-- TÍTULO -->

        <section class="page-header">

            <div>

                <h1>
                    Pedidos
                </h1>

                <p>
                    Gestioná los pedidos de Flame Burger
                </p>

            </div>

        </section>


        <!-- FILTROS -->

        <section class="orders-filters">

            <button
                type="button"
                class="order-filter active"
                data-filter="todos"
            >
                Todos
            </button>


            <button
                type="button"
                class="order-filter"
                data-filter="nuevo"
            >
                🆕 Nuevos
            </button>


            <button
                type="button"
                class="order-filter"
                data-filter="preparando"
            >
                👨‍🍳 Preparando
            </button>


            <button
                type="button"
                class="order-filter"
                data-filter="listo"
            >
                🍔 Listos
            </button>


            <button
                type="button"
                class="order-filter"
                data-filter="entregado"
            >
                🛵 Entregados
            </button>


            <button
                type="button"
                class="order-filter"
                data-filter="cancelado"
            >
                ❌ Cancelados
            </button>

        </section>


        <!-- LISTA DE PEDIDOS -->

        <section
            id="ordersList"
            class="orders-list"
        >

            <div class="empty-orders">

                <div class="empty-icon">
                    ⏳
                </div>

                <h3>
                    Cargando pedidos...
                </h3>

                <p>
                    Esperá un momento.
                </p>

            </div>

        </section>


    </main>


    <!-- FOOTER -->

    <footer class="admin-footer">

        <p>
            Flame Burger
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script src="js/pedidos.js"></script>


</body>

</html>
