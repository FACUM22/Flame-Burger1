<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Flame Burger - Finalizar pedido
    </title>

    <link
        rel="stylesheet"
        href="css/checkout.css"
    >

</head>


<body>


    <header class="checkout-header">

        <a
            href="/"
            class="volver"
        >
            ← Volver al menú
        </a>

        <div class="checkout-logo">
            🔥 FLAME BURGER
        </div>

    </header>



    <main class="checkout-container">


        <section class="checkout-form">


            <div class="titulo">

                <span>
                    FLAME BURGER
                </span>

                <h1>
                    Finalizar pedido
                </h1>

                <p>
                    Completá tus datos para realizar el pedido.
                </p>

            </div>



            <!-- DATOS DEL CLIENTE -->

            <div class="form-card">

                <h2>
                    👤 Tus datos
                </h2>


                <div class="campo">

                    <label for="nombre">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        placeholder="Tu nombre"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="telefono">
                        Teléfono
                    </label>

                    <input
                        type="tel"
                        id="telefono"
                        name="telefono"
                        inputmode="numeric"
                        pattern="[0-9]*"
                        maxlength="9"
                        placeholder="099123456"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="direccion">
                        Dirección
                    </label>

                    <input
                        type="text"
                        id="direccion"
                        placeholder="Calle y número"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="comentarios">
                        Comentarios
                    </label>

                    <textarea
                        id="comentarios"
                        placeholder="Ej: timbre rojo, apartamento 2..."
                    ></textarea>

                </div>

            </div>



            <!-- ENTREGA -->

            <div class="form-card">

                <h2>
                    🚚 Forma de entrega
                </h2>


                <div class="opciones">


                    <label class="opcion">

                        <input
                            type="radio"
                            name="entrega"
                            value="delivery"
                            checked
                        >

                        <div>

                            <strong>
                                🛵 Delivery
                            </strong>

                            <small>
                                Recibí tu pedido en tu domicilio.
                            </small>

                        </div>

                    </label>



                    <label class="opcion">

                        <input
                            type="radio"
                            name="entrega"
                            value="retiro"
                        >

                        <div>

                            <strong>
                                🏪 Retiro en el local
                            </strong>

                            <small>
                                Pasás a buscar tu pedido.
                            </small>

                        </div>

                    </label>


                </div>

            </div>



           <!-- PAGO -->
<div class="form-card">

    <h2> 💳 Forma de pago </h2>

    <div class="opciones">

        <!-- EFECTIVO -->
        <label class="opcion">

            <input
                type="radio"
                name="pago"
                value="efectivo"
                checked
            >

            <div>
                <strong> 💵 Efectivo </strong>

                <small>
                    Pagás al recibir el pedido.
                </small>
            </div>

        </label>


        <!-- POS -->
        <label class="opcion">

            <input
                type="radio"
                name="pago"
                value="pos"
            >

            <div>
                <strong> 💳 POS </strong>

                <small>
                    Pagás con tarjeta al recibir el pedido.
                </small>
            </div>

        </label>


        <!-- MERCADO PAGO -->
        <label class="opcion">

            <input
                type="radio"
                name="pago"
                value="mercado_pago"
            >

            <div>
                <strong> 💳 Mercado Pago </strong>

                <small>
                    Pagá online de forma segura.
                </small>
            </div>

        </label>

    </div>


    <!-- CAMBIO -->
    <div id="opcionCambio" class="cambio-opcion">

        <h3>¿Necesitás cambio?</h3>

        <div class="opciones cambio-radio">

            <label class="opcion">

                <input
                    type="radio"
                    name="necesitaCambio"
                    value="no"
                    checked
                >

                <div>
                    <strong>No</strong>
                </div>

            </label>


            <label class="opcion">

                <input
                    type="radio"
                    name="necesitaCambio"
                    value="si"
                >

                <div>
                    <strong>Sí</strong>
                </div>

            </label>

        </div>


        <!-- MONTO CON EL QUE PAGA -->
        <div
            id="campoCambio"
            class="campo campo-cambio"
            style="display: none;"
        >

            <label for="cambio">
                ¿Con cuánto vas a pagar?
            </label>

            <input
                type="number"
                id="cambio"
                min="0"
                step="1"
                placeholder="Ej: 1000"
            >

        </div>

    </div>

</div>






            <button
                id="confirmarPedido"
                class="confirmar"
                type="button"
            >
                Confirmar pedido
            </button>


            <p
                id="mensaje"
                class="mensaje"
            ></p>


        </section>



        <!-- RESUMEN -->

        <aside class="resumen">

            <div class="resumen-card">

                <h2>
                    🛒 Tu pedido
                </h2>


                <div
                    id="resumenProductos"
                    class="resumen-productos"
                ></div>


                <div class="linea"></div>


                <div class="resumen-total">

                    <span>
                        Total
                    </span>

                    <strong id="total">
                        $0
                    </strong>

                </div>


            </div>

        </aside>


    </main>



    <script src="js/checkout.js"></script>


</body>

</html>
