<!-- PAGO -->

<div class="form-card">

```
<h2>
    💳 Forma de pago
</h2>


<div class="opciones">


    <label class="opcion">

        <input
            type="radio"
            name="pago"
            value="efectivo"
            checked
        >

        <div>

            <strong>
                💵 Efectivo
            </strong>

            <small>
                Pagás al recibir el pedido.
            </small>

        </div>

    </label>



    <label class="opcion">

        <input
            type="radio"
            name="pago"
            value="mercado_pago"
        >

        <div>

            <strong>
                💳 Mercado Pago
            </strong>

            <small>
                Pagá online de forma segura.
            </small>

        </div>

    </label>


</div>


<!-- CAMBIO -->

<div
    id="opcionCambio"
    class="opcion-cambio"
>

    <div class="campo">

        <label>
            ¿Necesitás cambio?
        </label>


        <div class="opciones">

            <label class="opcion">

                <input
                    type="radio"
                    name="necesitaCambio"
                    value="si"
                >

                <div>

                    <strong>
                        Sí
                    </strong>

                </div>

            </label>


            <label class="opcion">

                <input
                    type="radio"
                    name="necesitaCambio"
                    value="no"
                    checked
                >

                <div>

                    <strong>
                        No
                    </strong>

                </div>

            </label>

        </div>

    </div>


    <!-- MONTO DEL CAMBIO -->

    <div
        id="campoCambio"
        class="campo"
        style="display: none;"
    >

        <label for="cambio">
            ¿Cambio de cuánto?
        </label>

        <input
            type="number"
            id="cambio"
            name="cambio"
            min="1"
            step="1"
            placeholder="Ej: 1000"
        >

        <small>
            Indicá con cuánto vas a pagar.
        </small>

    </div>

</div>
```

</div>
